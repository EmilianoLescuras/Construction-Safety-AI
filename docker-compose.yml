services:
  postgres:
    image: postgres:16-alpine
    container_name: cs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-construction_safety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-construction_safety}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-construction_safety} -d ${POSTGRES_DB:-construction_safety}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: cs_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-construction_safety}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-construction_safety}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Evidence images live on the host; mount read-only so the API can
      # serve them. Paths stored in the DB must resolve under /app/outputs.
      - ./outputs:/app/outputs:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time and read by the browser,
        # so it must point at the host-published API port, not the
        # internal "api" hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: cs_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  cs_pg_data:
    name: cs_pg_data
