# v2 dataset config: original 19-class data + auto-labelled frames from
# user-recorded videos under datasets/v2_inbox/.
#
# IMPORTANT: the v2_inbox labels are pseudo-labels generated by v1 (see
# scripts/pseudo_label_video.py). Until you open them in a labeller and
# correct them, fine-tuning here ONLY reinforces what v1 already
# predicts — it does NOT teach the model new classes (e.g. `pickup`) or
# fix the hi-vis-shirt false-positive. Treat this run as a pipeline
# smoke test, not as a real model improvement.

path: /Users/nanolescuras/construction_safety_ai/datasets
train:
  - train/images
  - v2_inbox/images
val: valid/images
test: test/images
nc: 19
names:
  - Excavator
  - Gloves
  - Hardhat
  - Ladder
  - Mask
  - NO-Hardhat
  - NO-Mask
  - NO-Safety Vest
  - Person
  - Safety Cone
  - Safety Vest
  - dump truck
  - machinery
  - sedan
  - trailer
  - truck
  - van
  - vehicle
  - wheel loader
