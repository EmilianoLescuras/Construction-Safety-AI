name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (lint + alembic + smoke import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-backend.txt

      - name: Install backend deps + ruff + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt
          pip install ruff pytest httpx

      - name: Ruff check
        run: ruff check src/backend src/alerts scripts tests

      - name: Alembic upgrade head (sqlite)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head

      - name: Alembic check (no pending migrations)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic check

      - name: Smoke import FastAPI app
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -c "from src.backend.app import app; print('app ok:', app.title)"

      - name: pytest
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: pytest tests/ -v

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
