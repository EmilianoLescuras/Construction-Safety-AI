name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (lint + alembic + smoke import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-backend.txt

      - name: Install backend deps + ruff + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt
          pip install ruff pytest httpx

      - name: Ruff check
        run: ruff check src scripts tests

      - name: Alembic upgrade head (sqlite)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head

      - name: Alembic check (no pending migrations)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic check

      - name: Smoke import FastAPI app
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -c "from src.backend.app import app; print('app ok:', app.title)"

      - name: pytest
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: pytest tests/ -v

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [python, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: construction_safety
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: construction_safety
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U construction_safety -d construction_safety"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://construction_safety:change-me@localhost:5432/construction_safety
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-backend.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt

      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Start API
        run: |
          nohup uvicorn src.backend.app:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:8000/health && break || sleep 1;
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm start > frontend.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://localhost:3000 && break || sleep 1;
          done

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
